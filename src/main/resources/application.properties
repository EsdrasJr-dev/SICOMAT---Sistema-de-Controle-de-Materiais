spring.config.import=optional:file:.env[.properties]
spring.application.name=sicomat
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.max-http-request-header-size=8KB

sicomat.cors.allowed-origins=${SICOMAT_CORS_ALLOWED_ORIGINS:}

sicomat.bootstrap.admin.nome=${SICOMAT_ADMIN_NOME:}
sicomat.bootstrap.admin.matricula=${SICOMAT_ADMIN_MATRICULA:}
sicomat.bootstrap.admin.senha=${SICOMAT_ADMIN_SENHA:}
sicomat.bootstrap.admin.setor=${SICOMAT_ADMIN_SETOR:}
