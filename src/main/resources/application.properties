spring.config.import=optional:file:.env[.properties]
spring.application.name=sicomat
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sicomat}
spring.datasource.username=${DB_USERNAME:sicomat}
spring.datasource.password=${DB_PASSWORD:sicomat}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

sicomat.bootstrap.admin.nome=${SICOMAT_ADMIN_NOME:}
sicomat.bootstrap.admin.matricula=${SICOMAT_ADMIN_MATRICULA:}
sicomat.bootstrap.admin.senha=${SICOMAT_ADMIN_SENHA:}
sicomat.bootstrap.admin.setor=${SICOMAT_ADMIN_SETOR:}