<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SICOMAT – Controle de Materiais</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/sicomat.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<!-- =================       LOGIN        ================= -->
<div id="login" class="container py-5" style="max-width: 400px">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h3 text-center mb-0">SICOMAT</h1>
      <p class="text-center text-body-secondary">Controle de Materiais</p>
      <div class="mb-3"><label class="form-label" for="login-login">Login</label><input id="login-login" class="form-control" inputmode="numeric" autocomplete="username"></div>
      <div class="mb-3"><label class="form-label" for="login-senha">Senha</label><input id="login-senha" type="password" class="form-control" autocomplete="current-password"></div>
      <p id="login-erro" class="text-danger small"></p>
      <button class="btn btn-primary w-100" data-action="entrar">Entrar</button>
    </div>
  </div>
</div>
<!--   ================= SISTEMA =================      -->
<div id="app" hidden>
<nav class="navbar navbar-expand-lg bg-body border-bottom">
  <div class="container-fluid">
    <span class="navbar-brand fw-bold">SICOMAT</span>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Abrir menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a href="#" class="nav-link active" data-go="inicio">Início</a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-go="consultar">Consultar Materiais</a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-go="registrar">Registrar Movimentação</a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-go="historico">Histórico</a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-go="relatorios">Relatórios</a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-go="gerenciar">Gerenciar Materiais</a></li>
      </ul>
      <span class="navbar-text me-3 text-end"><strong id="usuario-nome"></strong> <small id="usuario-perfil"></small></span>
      <button class="btn btn-outline-secondary btn-sm" data-action="sair">Sair</button>
    </div>
  </div>
</nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sicomat.js"></script>
</body>
</html>
