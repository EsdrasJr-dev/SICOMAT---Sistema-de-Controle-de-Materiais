services:
  database:
    image: postgres:17-alpine
    container_name: sicomat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sicomat}
      POSTGRES_USER: ${DB_USERNAME:-sicomat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sicomat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sicomat-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sicomat -d sicomat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sicomat-postgres-data: